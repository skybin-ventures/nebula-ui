name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test only; skip npm publish
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Build dist/ first so the consumer type-check project
      # (tsconfig.consumer.json) resolves @skybin-tech/nebula-ui against the
      # emitted declarations, matching how a real consumer imports the package.
      - run: pnpm build:lib
      - run: pnpm exec tsc -b
      - run: pnpm test
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
