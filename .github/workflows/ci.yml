name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build dist/ first so the consumer type-check project
      # (tsconfig.consumer.json) resolves @skybin-tech/nebula-ui against the
      # emitted declarations, matching how a real consumer imports the package.
      - run: pnpm build:lib
      - run: pnpm exec tsc -b
      - run: pnpm test
      - run: pnpm size
      - run: pnpm test:coverage
